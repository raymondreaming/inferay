[workspace]
members = [
    "native/core",
    "native/desktop-host",
    "native/diff-engine",
    "native/server",
    "native/tooling",
    "native/presentation",
]
resolver = "2"

# Keep interactive parsing responsive in the development app as well.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
