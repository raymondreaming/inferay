[package]
name = "inferay-desktop"
version = "0.1.111"
edition = "2024"
license = "LicenseRef-Inferay"
description = "Minimal Rust desktop host for the existing inferay UI"

[dependencies]
inferay-server = { path = "../server" }
tao = "=0.36.0"
wry = "=0.56.0"
window-vibrancy = "=0.8.0"
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAppearance", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace", "std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString", "NSURL", "std"] }
