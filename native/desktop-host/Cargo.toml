[package]
name = "inferay-desktop"
version = "0.1.92"
edition = "2024"
license = "LicenseRef-Inferay"
description = "Minimal Rust desktop host for the existing inferay UI"

[dependencies]
tao = "=0.36.0"
wry = "=0.56.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder", "std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString", "std"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
