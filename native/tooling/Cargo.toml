[package]
default-run = "inferay-tooling"
name = "inferay-tooling"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Inferay"
description = "Rust-native development and release tooling for Inferay"

[dependencies]
inferay-server = { path = "../server" }
inferay-core = { path = "../core" }
inferay-native-diff = { path = "../diff-engine" }
inferay-presentation = { path = "../presentation" }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
regex = "1.12.2"
serde_json = "1.0"
sha2 = "0.10.9"
tempfile = "3.27.0"
walkdir = "2.5.0"
