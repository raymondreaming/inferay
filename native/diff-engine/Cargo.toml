[package]
name = "inferay-native-diff"
version = "0.1.0"
edition = "2021"

[dependencies]
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
inferay-core = { path = "../core" }
wait-timeout = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.27.0"
