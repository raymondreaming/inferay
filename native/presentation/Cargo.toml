[package]
name = "inferay-presentation"
version = "0.1.0"
edition = "2024"
description = "Rust-owned renderer models; no DOM, network, or persistence"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "=0.2.127"
