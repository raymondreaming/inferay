[package]
name = "inferay-rune"
version = "0.1.123"
edition = "2024"
license = "LicenseRef-Inferay"
publish = false

[[bin]]
name = "inferay"
path = "src/main.rs"

[workspace]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "d77610b546ce70ca3d8ffcb22e078278d2bb79b7", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "d77610b546ce70ca3d8ffcb22e078278d2bb79b7", features = ["markdown"] }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "d77610b546ce70ca3d8ffcb22e078278d2bb79b7" }
inferay-server = { path = "../server" }
inferay-presentation = { path = "../presentation" }
inferay-core = { path = "../core" }
inferay-native-diff = { path = "../diff-engine" }
futures-util = "0.3.32"
tokio-tungstenite = "0.29.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "multipart"] }
url = "2.5.8"
resvg = { version = "0.45", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "time", "net"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
unicode-segmentation = "1"
anyhow = "1"
env_logger = "0.11"
chrono-tz = "0.10"
iana-time-zone = "0.1"
chrono = "0.4"

skrifa = "0.44.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFCGTypes"] }
objc2 = "0.5.2"
block2 = "0.5.1"
objc2-foundation = { version = "0.2.2", features = ["NSString", "NSGeometry", "NSThread", "NSURL", "NSArray", "NSEnumerator"] }
objc2-app-kit = { version = "0.2.2", features = ["NSView", "NSWindow", "NSVisualEffectView", "NSAppearance", "NSResponder", "NSGraphics", "NSOpenPanel", "NSSavePanel", "NSPanel", "block2"] }

[dev-dependencies]
tempfile = "3"

[features]
tooling = ["rune/tooling"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2


[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "d77610b546ce70ca3d8ffcb22e078278d2bb79b7" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "d77610b546ce70ca3d8ffcb22e078278d2bb79b7" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "d77610b546ce70ca3d8ffcb22e078278d2bb79b7" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "d77610b546ce70ca3d8ffcb22e078278d2bb79b7" }
